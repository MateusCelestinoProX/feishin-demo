        <script>
            // 1. Polyfill Navigator MediaSession no Android WebView
            if (!('mediaSession' in navigator) || !navigator.mediaSession) {
                var mediaHandlers = {};
                navigator.mediaSession = {
                    metadata: null,
                    playbackState: 'none',
                    setActionHandler: function(action, handler) {
                        mediaHandlers[action] = handler;
                    },
                    setPositionState: function(state) {}
                };
                window.MediaMetadata = window.MediaMetadata || function(data) {
                    Object.assign(this, data);
                };
            }

            // 2. Polyfill universal para compatibilidade Web/macOS com o core do Feishin Electron
            window.api = {
                lyrics: {
                    convertFurigana: function(t) { return t; },
                    convertFuriganaFragment: function(t) { return t; },
                    convertRomaji: function(t) { return t; },
                    convertRomajiTokens: function(t) { return t; },
                    parseLyricsTextTokens: function(t) { return t; }
                },
                utils: {
                    isLinux: function() { return false; },
                    isMacOS: function() { return true; },
                    isWindows: function() { return false; },
                    getPlatform: function() { return 'darwin'; },
                    openExternal: function(url) { window.open(url, '_blank'); }
                },
                ipc: {
                    send: function() {},
                    on: function() {},
                    invoke: async function() { return null; }
                },
                localSettings: null,
                mpvPlayer: null,
                discordRpc: null,
                dlnaPlayer: null,
                remote: null,
                customThemes: null,
                browser: null
            };

            (function () {
                if (!window.location.hash || window.location.hash === '#' || window.location.hash === '#/' || window.location.hash === '#/home' || window.location.hash.startsWith('#/home')) {
                    window.location.hash = '#/library/songs';
                }
            })();
        </script>
      <script type="module">
        import './assets/webgl-backgrounds.js';
        (function () {
          var orig = window.renderWebGLBackground;
          if (!orig) return;
          var eco = localStorage.getItem('feishin_shader_eco') === 'true';
          var boot = localStorage.getItem('feishin_active_shader') || 'plasmawave';
          var skipNext = !eco;
          function wrapped(type) {
            type = type || localStorage.getItem('feishin_active_shader') || 'plasmawave';
            var c = document.getElementById('bg-webgl-container');
            if (skipNext) { skipNext = false; if (type === boot && c && c.querySelector('canvas')) return; }
            return orig.call(window, type);
          }
          window.renderWebGLBackground = wrapped;
          window.setWebGLBackground = wrapped;
          if (!eco) {
            if (window.requestIdleCallback) {
              window.requestIdleCallback(function() { orig.call(window, boot); }, { timeout: 350 });
            } else {
              setTimeout(function() { orig.call(window, boot); }, 80);
            }
          }
        })();
      </script>
